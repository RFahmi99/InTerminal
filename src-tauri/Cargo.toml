[package]
name = "interminal"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "interminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# All tests live in the library. Skipping the empty test harness for main.rs
# also avoids a freshly built, unsigned executable that Smart App Control
# can block.
[[bin]]
name = "interminal"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
regex = "1.13.1"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4"] }
trash = "5"
sha2 = "0.11"
log = "0.4.34"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# Windows' own TLS (SChannel), like ureq; NSIS updates need no archive support.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls-no-default"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind (not abort) so a panic in a background thread, such as the command
# indexer, stays contained and the terminal keeps working.
strip = true

[dev-dependencies]
tempfile = "3.27.0"
